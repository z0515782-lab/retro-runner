<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Pokémon Yellow - Kindle Scribe</title>
  <style>
    * {
      box-sizing: border-box;
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      user-select: none;
    }
    html, body {
      background: #fff;
      color: #000;
      margin: 0;
      padding: 0;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      font-family: sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
    }

    #status {
      font-size: 18px;
      font-weight: bold;
      padding: 6px;
      text-align: center;
    }

    /* Crisp Game Boy screen for E-ink */
    canvas#mainCanvas {
      image-rendering: -webkit-optimize-contrast;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
      width: 320px;
      height: 288px;
      border: 4px solid #000;
      background: #fff;
      display: block;
      margin: 0 auto;
    }

    /* Kindle Touch Controller */
    #touch-controls {
      width: 100%;
      max-width: 650px;
      height: 280px;
      display: flex;
      justify-content: space-between;
      padding: 10px 20px 25px 20px;
    }

    /* D-PAD */
    .dpad {
      position: relative;
      width: 180px;
      height: 180px;
    }
    .dpad-btn {
      position: absolute;
      width: 58px;
      height: 58px;
      background: #fff;
      border: 3px solid #000;
      font-size: 28px;
      font-weight: bold;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .dpad-btn:active { background: #000; color: #fff; }
    #btn-up    { top: 0; left: 61px; }
    #btn-down  { bottom: 0; left: 61px; }
    #btn-left  { top: 61px; left: 0; }
    #btn-right { top: 61px; right: 0; }

    /* ACTION BUTTONS (A, B) */
    .action-group {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      width: 190px;
    }
    .ab-btns {
      display: flex;
      gap: 20px;
      margin-top: 15px;
    }
    .round-btn {
      width: 75px;
      height: 75px;
      border-radius: 50%;
      background: #fff;
      border: 3px solid #000;
      font-size: 28px;
      font-weight: bold;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .round-btn:active { background: #000; color: #fff; }

    /* START / SELECT */
    .menu-btns {
      display: flex;
      gap: 15px;
      margin-bottom: 10px;
    }
    .pill-btn {
      width: 85px;
      height: 40px;
      background: #fff;
      border: 3px solid #000;
      border-radius: 12px;
      font-size: 14px;
      font-weight: bold;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .pill-btn:active { background: #000; color: #fff; }
  </style>
</head>
<body>

  <div id="status">Loading pure JavaScript Game Boy engine...</div>

  <canvas id="mainCanvas" width="160" height="144"></canvas>

  <div id="touch-controls">
    <!-- D-PAD -->
    <div class="dpad">
      <div class="dpad-btn" id="btn-up">▲</div>
      <div class="dpad-btn" id="btn-left">◀</div>
      <div class="dpad-btn" id="btn-right">▶</div>
      <div class="dpad-btn" id="btn-down">▼</div>
    </div>

    <!-- START / SELECT + A / B -->
    <div class="action-group">
      <div class="ab-btns">
        <div class="round-btn" id="btn-b">B</div>
        <div class="round-btn" id="btn-a">A</div>
      </div>
      <div class="menu-btns">
        <div class="pill-btn" id="btn-select">SELECT</div>
        <div class="pill-btn" id="btn-start">START</div>
      </div>
    </div>
  </div>

  <script>
    // 1. Mock legacy variables so it never crashes
    function cout(m) {}
    cout.value = "";
    cout.appendText = function() {};
    window.cout = cout;

    // 2. Completely bypass Audio so Kindle browser never crashes
    window.XAudioServer = function() {
      return {
        writeAudio: function() {},
        changeVolume: function() {},
        executeCallback: function() {}
      };
    };
  </script>

  <!-- Load pure JavaScript emulator directly from CDN (ZERO extra folders needed) -->
  <script src="https://cdn.jsdelivr.net/gh/taisel/GameBoy-Online/js/other/resampler.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/taisel/GameBoy-Online/js/GameBoyCore.js"></script>

  <script>
    const statusText = document.getElementById("status");
    const canvas = document.getElementById("mainCanvas");
    let gb = null;

    // Fetch Yellow ROM and boot directly in pure JavaScript
    fetch("pokemon_yellow.gbc")
      .then(resp => {
        if (!resp.ok) throw new Error("Could not find pokemon_yellow.gbc");
        statusText.innerText = "Reading Pokémon Yellow...";
        return resp.arrayBuffer();
      })
      .then(buf => {
        let bin = "";
        let bytes = new Uint8Array(buf);
        for (let i = 0; i < bytes.byteLength; i++) {
          bin += String.fromCharCode(bytes[i]);
        }

        statusText.innerText = "Starting Game...";
        
        // Launch Pure JavaScript GameBoy instance
        gb = new GameBoyCore(canvas, bin);
        gb.soundMasterEnabled = false; // Silence for Kindle performance
        gb.start();

        statusText.style.display = "none";
      })
      .catch(err => {
        statusText.innerText = "Error: " + err.message;
      });

    // Touch Event Hookups for Kindle Scribe
    // GameBoyCore Joypad mapping:
    // 0: Right, 1: Left, 2: Up, 3: Down, 4: A, 5: B, 6: Select, 7: Start
    function bindTouch(id, keyIndex) {
      const el = document.getElementById(id);
      if (!el) return;

      const press = (e) => {
        e.preventDefault();
        if (gb) gb.JoyPadEvent(keyIndex, true);
      };
      const release = (e) => {
        e.preventDefault();
        if (gb) gb.JoyPadEvent(keyIndex, false);
      };

      el.addEventListener("touchstart", press, {passive: false});
      el.addEventListener("touchend", release, {passive: false});
      el.addEventListener("mousedown", press);
      el.addEventListener("mouseup", release);
    }

    bindTouch("btn-right", 0);
    bindTouch("btn-left", 1);
    bindTouch("btn-up", 2);
    bindTouch("btn-down", 3);
    bindTouch("btn-a", 4);
    bindTouch("btn-b", 5);
    bindTouch("btn-select", 6);
    bindTouch("btn-start", 7);
  </script>
</body>
</html>
