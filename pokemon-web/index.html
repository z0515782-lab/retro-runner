<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Pokémon Yellow - Kindle Scribe</title>
  <style>
    * {
      box-sizing: border-box;
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      user-select: none;
      /* CRITICAL FOR KINDLE: stops browser gesture intercepting taps */
      touch-action: none;
    }
    html, body {
      background: #ffffff;
      color: #000000;
      margin: 0;
      padding: 0;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      font-family: sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
    }

    #status {
      font-size: 16px;
      font-weight: bold;
      padding: 4px;
      text-align: center;
      word-break: break-all;
    }

    /* Game Boy screen scaled nicely for Kindle Scribe */
    canvas#mainCanvas {
      image-rendering: -webkit-optimize-contrast;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
      width: 320px;
      height: 288px;
      border: 4px solid #000;
      background: #fff;
      display: block;
      margin: 0 auto;
    }

    /* Kindle Controller */
    #touch-controls {
      width: 100%;
      max-width: 600px;
      height: 270px;
      display: flex;
      justify-content: space-between;
      padding: 10px 20px 20px 20px;
    }

    /* D-PAD */
    .dpad {
      position: relative;
      width: 180px;
      height: 180px;
    }
    .dpad-btn {
      position: absolute;
      width: 58px;
      height: 58px;
      background: #ffffff;
      border: 3px solid #000000;
      font-size: 26px;
      font-weight: bold;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .dpad-btn:active { background: #000; color: #fff; }
    #btn-up    { top: 0; left: 61px; }
    #btn-down  { bottom: 0; left: 61px; }
    #btn-left  { top: 61px; left: 0; }
    #btn-right { top: 61px; right: 0; }

    /* ACTION BUTTONS (A, B) */
    .action-group {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      width: 190px;
    }
    .ab-btns {
      display: flex;
      gap: 20px;
      margin-top: 10px;
    }
    .round-btn {
      width: 72px;
      height: 72px;
      border-radius: 50%;
      background: #ffffff;
      border: 3px solid #000000;
      font-size: 26px;
      font-weight: bold;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .round-btn:active { background: #000; color: #fff; }

    /* START / SELECT */
    .menu-btns {
      display: flex;
      gap: 15px;
      margin-bottom: 10px;
    }
    .pill-btn {
      width: 82px;
      height: 38px;
      background: #ffffff;
      border: 3px solid #000000;
      border-radius: 10px;
      font-size: 13px;
      font-weight: bold;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .pill-btn:active { background: #000; color: #fff; }
  </style>
</head>
<body>

  <div id="status">Loading...</div>

  <canvas id="mainCanvas" width="160" height="144"></canvas>

  <div id="touch-controls">
    <div class="dpad">
      <div class="dpad-btn" id="btn-up">▲</div>
      <div class="dpad-btn" id="btn-left">◀</div>
      <div class="dpad-btn" id="btn-right">▶</div>
      <div class="dpad-btn" id="btn-down">▼</div>
    </div>

    <div class="action-group">
      <div class="ab-btns">
        <div class="round-btn" id="btn-b">B</div>
        <div class="round-btn" id="btn-a">A</div>
      </div>
      <div class="menu-btns">
        <div class="pill-btn" id="btn-select">SELECT</div>
        <div class="pill-btn" id="btn-start">START</div>
      </div>
    </div>
  </div>

  <script>
    // Visual error logging on screen (since Kindle has no F12 console)
    window.onerror = function(msg, url, line) {
      document.getElementById("status").style.display = "block";
      document.getElementById("status").innerText = "Err: " + msg + " (" + line + ")";
      return false;
    };

    // Low-overhead settings for GameBoy-Online
    // [sound, prioritizeSpeed, showFPS, skipFrames, ...]
    var settings = [
      false, // 0: Sound off
      true,  // 1: Speed priority
      false, // 2: No FPS counter
      true,  // 3: Frame-skipping ON (mandatory for Kindle!)
      true,  // 4: Auto frame-skip
      false, // 5: Sound channels
      false, false, false, false, false, false, false, false, false
    ];
    window.settings = settings;

    // Stubs for legacy GameBoy-Online logging
    window.cout = function() {};
    window.cout.value = "";
    window.cout.appendText = function() {};

    // Kill audio so WebAudio doesn't stall Kindle
    window.XAudioServer = function() {
      return { writeAudio: function(){}, changeVolume: function(){}, executeCallback: function(){} };
    };

    // Missing canvas initializer fix
    window.initNewCanvas = function() {
      return document.getElementById("mainCanvas");
    };
  </script>

  <!-- Load pure JS emulator -->
  <script src="https://cdn.jsdelivr.net/gh/taisel/GameBoy-Online/js/other/resampler.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/taisel/GameBoy-Online/js/GameBoyCore.js"></script>

  <script>
    const statusText = document.getElementById("status");
    const canvas = document.getElementById("mainCanvas");
    let gb = null;

    fetch("pokemon_yellow.gbc")
      .then(resp => {
        if (!resp.ok) throw new Error("ROM not found: pokemon_yellow.gbc");
        statusText.innerText = "Decompressing ROM...";
        return resp.arrayBuffer();
      })
      .then(buf => {
        let bin = "";
        let bytes = new Uint8Array(buf);
        const len = bytes.byteLength;
        for (let i = 0; i < len; i++) {
          bin += String.fromCharCode(bytes[i]);
        }

        statusText.innerText = "Starting engine...";

        gb = new GameBoyCore(canvas, bin);
        gb.soundMasterEnabled = false;
        
        // Force frame skip interval to reduce e-ink paint pressure
        gb.emulatorIntervalInterval = 20; 

        gb.start();
        statusText.style.display = "none";
      })
      .catch(err => {
        statusText.innerText = "Load failed: " + err.message;
      });

    // Touch controls with preventDefault to eliminate Kindle tap-delay
    function bindTouch(id, keyIndex) {
      const el = document.getElementById(id);
      if (!el) return;

      const press = (e) => {
        e.preventDefault();
        e.stopPropagation();
        if (gb) gb.JoyPadEvent(keyIndex, true);
      };

      const release = (e) => {
        e.preventDefault();
        e.stopPropagation();
        if (gb) gb.JoyPadEvent(keyIndex, false);
      };

      el.addEventListener("touchstart", press, { passive: false });
      el.addEventListener("touchend", release, { passive: false });
      el.addEventListener("mousedown", press);
      el.addEventListener("mouseup", release);
    }

    bindTouch("btn-right", 0);
    bindTouch("btn-left", 1);
    bindTouch("btn-up", 2);
    bindTouch("btn-down", 3);
    bindTouch("btn-a", 4);
    bindTouch("btn-b", 5);
    bindTouch("btn-select", 6);
    bindTouch("btn-start", 7);
  </script>
</body>
</html>
