<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Pokémon Yellow - Kindle Scribe</title>
  <style>
    * {
      box-sizing: border-box;
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      user-select: none;
      touch-action: none;
    }
    html, body {
      background: #ffffff;
      color: #000000;
      margin: 0;
      padding: 0;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      font-family: sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
    }

    #status {
      font-size: 16px;
      font-weight: bold;
      padding: 4px;
      text-align: center;
    }

    canvas#mainCanvas {
      image-rendering: -webkit-optimize-contrast;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
      width: 320px;
      height: 288px;
      border: 4px solid #000;
      background: #fff;
      display: block;
      margin: 10px auto 0 auto;
    }

    #touch-controls {
      width: 100%;
      max-width: 600px;
      height: 270px;
      display: flex;
      justify-content: space-between;
      padding: 10px 20px 20px 20px;
    }

    .dpad {
      position: relative;
      width: 180px;
      height: 180px;
    }
    .dpad-btn {
      position: absolute;
      width: 58px;
      height: 58px;
      background: #ffffff;
      border: 3px solid #000000;
      font-size: 26px;
      font-weight: bold;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .dpad-btn:active { background: #000; color: #fff; }
    #btn-up    { top: 0; left: 61px; }
    #btn-down  { bottom: 0; left: 61px; }
    #btn-left  { top: 61px; left: 0; }
    #btn-right { top: 61px; right: 0; }

    .action-group {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      width: 190px;
    }
    .ab-btns {
      display: flex;
      gap: 20px;
      margin-top: 10px;
    }
    .round-btn {
      width: 72px;
      height: 72px;
      border-radius: 50%;
      background: #ffffff;
      border: 3px solid #000000;
      font-size: 26px;
      font-weight: bold;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .round-btn:active { background: #000; color: #fff; }

    .menu-btns {
      display: flex;
      gap: 15px;
      margin-bottom: 10px;
    }
    .pill-btn {
      width: 82px;
      height: 38px;
      background: #ffffff;
      border: 3px solid #000000;
      border-radius: 10px;
      font-size: 13px;
      font-weight: bold;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .pill-btn:active { background: #000; color: #fff; }
  </style>
</head>
<body>

  <div id="status">Loading...</div>
  <canvas id="mainCanvas" width="160" height="144"></canvas>

  <div id="touch-controls">
    <div class="dpad">
      <div class="dpad-btn" id="btn-up">▲</div>
      <div class="dpad-btn" id="btn-left">◀</div>
      <div class="dpad-btn" id="btn-right">▶</div>
      <div class="dpad-btn" id="btn-down">▼</div>
    </div>

    <div class="action-group">
      <div class="ab-btns">
        <div class="round-btn" id="btn-b">B</div>
        <div class="round-btn" id="btn-a">A</div>
      </div>
      <div class="menu-btns">
        <div class="pill-btn" id="btn-select">SELECT</div>
        <div class="pill-btn" id="btn-start">START</div>
      </div>
    </div>
  </div>

  <script>
    // GameBoy emulator settings
    window.settings = [
      false, // Sound off
      true,  // Speed prioritized
      false, // FPS disabled
      true,  // Frame skip enabled
      true,  // Auto frame-skipping
      false, false, false, false, false, false, false, false, false, false
    ];

    window.cout = function() {};
    window.cout.value = "";
    window.cout.appendText = function() {};

    window.XAudioServer = function() {
      return { writeAudio: function(){}, changeVolume: function(){}, executeCallback: function(){} };
    };

    // Prepare canvas context & image buffer that GameBoyCore demands
    const canvas = document.getElementById("mainCanvas");
    const ctx = canvas.getContext("2d");
    let canvasImgData = ctx.createImageData(160, 144);

    // Provide the required canvas initializer for GameBoyCore
    window.initNewCanvas = function() {
      return canvas;
    };
  </script>

  <!-- Load emulator core -->
  <script src="https://cdn.jsdelivr.net/gh/taisel/GameBoy-Online/js/other/resampler.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/taisel/GameBoy-Online/js/GameBoyCore.js"></script>

  <script>
    const statusText = document.getElementById("status");
    let gb = null;

    fetch("pokemon_yellow.gbc")
      .then(resp => {
        if (!resp.ok) throw new Error("Could not load pokemon_yellow.gbc (" + resp.status + ")");
        statusText.innerText = "Processing ROM...";
        return resp.arrayBuffer();
      })
      .then(buf => {
        let bin = "";
        let bytes = new Uint8Array(buf);
        const len = bytes.byteLength;
        for (let i = 0; i < len; i++) {
          bin += String.fromCharCode(bytes[i]);
        }

        statusText.innerText = "Initializing GameBoy Core...";

        // GameBoyCore expects: (canvasElement, ROMString)
        gb = new GameBoyCore(canvas, bin);
        gb.soundMasterEnabled = false;

        // Hook up frame renderer explicitly
        gb.canvas = canvas;
        gb.context = ctx;
        
        // Start emulation execution
        gb.start();

        // Game Boy title screen starts with a pure white fade for the first ~0.5–1s!
        statusText.style.display = "none";
      })
      .catch(err => {
        statusText.innerText = "Error: " + err.message;
        console.error(err);
      });

    // Touch & Mouse bindings
    // 0: Right, 1: Left, 2: Up, 3: Down, 4: A, 5: B, 6: Select, 7: Start
    function bindTouch(id, keyIndex) {
      const el = document.getElementById(id);
      if (!el) return;

      const press = (e) => {
        e.preventDefault();
        if (gb) gb.JoyPadEvent(keyIndex, true);
      };

      const release = (e) => {
        e.preventDefault();
        if (gb) gb.JoyPadEvent(keyIndex, false);
      };

      el.addEventListener("touchstart", press, { passive: false });
      el.addEventListener("touchend", release, { passive: false });
      el.addEventListener("mousedown", press);
      el.addEventListener("mouseup", release);
    }

    bindTouch("btn-right", 0);
    bindTouch("btn-left", 1);
    bindTouch("btn-up", 2);
    bindTouch("btn-down", 3);
    bindTouch("btn-a", 4);
    bindTouch("btn-b", 5);
    bindTouch("btn-select", 6);
    bindTouch("btn-start", 7);

    // Keyboard support for testing on Mac/PC (Arrow keys + Z/X + Enter/Shift)
    window.addEventListener("keydown", (e) => {
      if (!gb) return;
      if (e.key === "ArrowRight") gb.JoyPadEvent(0, true);
      if (e.key === "ArrowLeft")  gb.JoyPadEvent(1, true);
      if (e.key === "ArrowUp")    gb.JoyPadEvent(2, true);
      if (e.key === "ArrowDown")  gb.JoyPadEvent(3, true);
      if (e.key === "z" || e.key === "Z") gb.JoyPadEvent(4, true); // A
      if (e.key === "x" || e.key === "X") gb.JoyPadEvent(5, true); // B
      if (e.key === "Shift")      gb.JoyPadEvent(6, true);          // Select
      if (e.key === "Enter")      gb.JoyPadEvent(7, true);          // Start
    });

    window.addEventListener("keyup", (e) => {
      if (!gb) return;
      if (e.key === "ArrowRight") gb.JoyPadEvent(0, false);
      if (e.key === "ArrowLeft")  gb.JoyPadEvent(1, false);
      if (e.key === "ArrowUp")    gb.JoyPadEvent(2, false);
      if (e.key === "ArrowDown")  gb.JoyPadEvent(3, false);
      if (e.key === "z" || e.key === "Z") gb.JoyPadEvent(4, false);
      if (e.key === "x" || e.key === "X") gb.JoyPadEvent(5, false);
      if (e.key === "Shift")      gb.JoyPadEvent(6, false);
      if (e.key === "Enter")      gb.JoyPadEvent(7, false);
    });
  </script>
</body>
</html>
