<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Pokémon Yellow - Kindle Scribe</title>
  <style>
    * {
      box-sizing: border-box;
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      user-select: none;
      touch-action: none;
    }
    html, body {
      background: #ffffff;
      color: #000000;
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
    }
    #status {
      font-size: 16px;
      font-weight: bold;
      padding: 4px;
      text-align: center;
      min-height: 28px;
    }
    canvas.hc { -webkit-filter: grayscale(1) contrast(1.8); filter: grayscale(1) contrast(1.8); }
    #hc {
      position: fixed; top: 6px; left: 6px; z-index: 5;
      font-size: 13px; font-weight: bold;
      border: 2px solid #000; border-radius: 8px;
      padding: 6px 10px; background: #fff;
    }
    #hc.on { background: #000; color: #fff; }
    #picker { display: none; font-size: 16px; padding: 6px; touch-action: auto; }
    canvas#mainCanvas {
      image-rendering: -webkit-optimize-contrast;
      image-rendering: -moz-crisp-edges;
      image-rendering: crisp-edges;
      image-rendering: pixelated;
      width: 320px;
      height: 288px;
      border: 4px solid #000;
      background: #fff;
      display: block;
      margin: 10px auto 0 auto;
    }
    #controls-wrap {
      width: 100%;
      margin-top: auto;
      display: flex;
      justify-content: center;
      overflow: visible;
    }
    #touch-controls {
      width: 560px;
      flex-shrink: 0;
      transform-origin: top center;
      height: 270px;
      display: flex;
      justify-content: space-between;
      padding: 10px 20px 20px 20px;
    }
    .dpad { position: relative; width: 180px; height: 180px; }
    .dpad-btn {
      position: absolute;
      width: 58px; height: 58px;
      background: #fff;
      border: 3px solid #000;
      font-size: 26px; font-weight: bold;
      display: flex; align-items: center; justify-content: center;
    }
    .dpad-btn.down, .round-btn.down, .pill-btn.down { background: #000; color: #fff; }
    #btn-up    { top: 0; left: 61px; }
    #btn-down  { bottom: 0; left: 61px; }
    #btn-left  { top: 61px; left: 0; }
    #btn-right { top: 61px; right: 0; }
    .action-group {
      display: flex; flex-direction: column;
      justify-content: space-between; align-items: center;
      width: 190px;
    }
    .ab-btns { display: flex; gap: 20px; margin-top: 10px; }
    .round-btn {
      width: 72px; height: 72px; border-radius: 50%;
      background: #fff; border: 3px solid #000;
      font-size: 26px; font-weight: bold;
      display: flex; align-items: center; justify-content: center;
    }
    .menu-btns { display: flex; gap: 15px; margin-bottom: 10px; }
    .pill-btn {
      width: 82px; height: 38px;
      background: #fff; border: 3px solid #000; border-radius: 10px;
      font-size: 13px; font-weight: bold;
      display: flex; align-items: center; justify-content: center;
    }
  </style>
</head>
<body>

  <div id="hc">B&amp;W</div>
  <div id="status">Loading...</div>
  <input type="file" id="picker" accept=".gb,.gbc">
  <canvas id="mainCanvas" width="160" height="144"></canvas>

  <div id="controls-wrap"><div id="touch-controls">
    <div class="dpad">
      <div class="dpad-btn" id="btn-up">▲</div>
      <div class="dpad-btn" id="btn-left">◀</div>
      <div class="dpad-btn" id="btn-right">▶</div>
      <div class="dpad-btn" id="btn-down">▼</div>
    </div>
    <div class="action-group">
      <div class="ab-btns">
        <div class="round-btn" id="btn-b">B</div>
        <div class="round-btn" id="btn-a">A</div>
      </div>
      <div class="menu-btns">
        <div class="pill-btn" id="btn-select">SELECT</div>
        <div class="pill-btn" id="btn-start">START</div>
      </div>
    </div>
  </div></div>

  <script>
    // Show any JS error on screen so a "white screen" is never silent
    window.onerror = function (msg, src, line) {
      var s = document.getElementById("status");
      s.style.display = "block";
      s.innerText = "JS error: " + msg + " (line " + line + ")";
    };

    // GameBoyCore reads these as globals. The ORDER matters (indexes are fixed by the core).
    var LOOP_MS = 16;
    window.settings = [
      false,  // 0  sound on (off)
      true,   // 1  boot with boot ROM first
      false,  // 2  give priority to GameBoy mode
      1,      // 3  volume
      false,  // 4  colorize GB mode
      false,  // 5  disallow typed arrays
      LOOP_MS,// 6  emulator loop interval (ms)  <-- must be a number
      10,     // 7  audio buffer min span
      20,     // 8  audio buffer max span
      false,  // 9  MBC1 override
      false,  // 10 always allow RAM banks
      false,  // 11 use GB boot ROM instead of GBC boot ROM
      false,  // 12 scale canvas in JS
      false,  // 13 image smoothing
      [true, true, true, true] // 14 sound channel enables
    ];

    // Globals the core expects
    window.cout = function () {};
    window.pause = function () { window.gbPaused = true; };
    // The core calls these as bare globals while setting up the LCD. The canvas is
    // already 160x144 (CSS scales it), so no-ops are enough.
    window.initNewCanvas = function () {};
    window.initNewCanvasSize = function () {};
    window.XAudioServer = function () {
      return { writeAudio: function(){}, changeVolume: function(){}, executeCallback: function(){} };
    };
  </script>

  <!-- Emulator core (sound is off, so the resampler/audio files aren't needed) -->
  <script src="https://cdn.jsdelivr.net/gh/taisel/GameBoy-Online/js/GameBoyCore.js"></script>

  <script>
    var statusText = document.getElementById("status");
    var picker = document.getElementById("picker");
    var canvas = document.getElementById("mainCanvas");
    var gb = null;
    var runTimer = null;

    function bufToBinString(buf) {
      var bytes = new Uint8Array(buf);
      var out = "";
      var CHUNK = 0x8000;
      for (var i = 0; i < bytes.length; i += CHUNK) {
        out += String.fromCharCode.apply(null, bytes.subarray(i, i + CHUNK));
      }
      return out;
    }

    function startGame(buf) {
      if (typeof GameBoyCore === "undefined") {
        throw new Error("GameBoyCore.js did not load (check internet / CDN)");
      }
      statusText.innerText = "Starting emulator...";
      var rom = bufToBinString(buf);

      if (runTimer) clearInterval(runTimer);

      gb = new GameBoyCore(canvas, rom);
      // The core calls these for battery saves / RTC; they must exist or start() throws.
      gb.openMBC = function () { return []; };
      gb.openRTC = function () { return []; };
      gb.start();
      try {
        var c2d = canvas.getContext("2d");
        c2d.imageSmoothingEnabled = false;
        c2d.webkitImageSmoothingEnabled = false;
        c2d.mozImageSmoothingEnabled = false;
      } catch (e) {}

      // THE IMPORTANT PART: start() only initializes. Something must call gb.run() repeatedly.
      gb.stopEmulator &= 1;
      gb.firstIteration = new Date().getTime();
      gb.iterations = 0;
      runTimer = setInterval(function () {
        if (!document.hidden && gb) gb.run();
      }, LOOP_MS);

      statusText.style.display = "none";
      picker.style.display = "none";
      layout();
    }

    function showPicker(reason) {
      statusText.innerText = reason + " — choose the ROM file:";
      picker.style.display = "block";
      layout();
    }

    picker.addEventListener("change", function () {
      var f = picker.files && picker.files[0];
      if (!f) return;
      var r = new FileReader();
      r.onload = function () {
        try { startGame(r.result); } catch (e) { statusText.innerText = "Error: " + e.message; }
      };
      r.readAsArrayBuffer(f);
    });

    fetch("pokemon_yellow.gbc")
      .then(function (resp) {
        if (!resp.ok) throw new Error("HTTP " + resp.status);
        statusText.innerText = "Processing ROM...";
        return resp.arrayBuffer();
      })
      .then(function (buf) { startGame(buf); })
      .catch(function (err) {
        // Opening index.html straight from disk (file://) blocks fetch(); fall back to a picker.
        showPicker("Couldn't auto-load ROM (" + err.message + ")");
      });

    // B&W / high-contrast toggle (remembered; also ?hc=1 in the URL turns it on)
    (function () {
      var btn = document.getElementById("hc");
      function set(on) {
        canvas.className = on ? "hc" : "";
        btn.className = on ? "on" : "";
        try { localStorage.setItem("hc", on ? "1" : "0"); } catch (e) {}
      }
      var start = /[?&]hc=1/.test(location.search);
      try { if (localStorage.getItem("hc") === "1") start = true; } catch (e) {}
      set(start);
      var lock = 0;
      function toggle(e) {
        e.preventDefault();
        var now = new Date().getTime();
        if (now - lock < 400) return; // ignore touch + click double-fire
        lock = now;
        set(canvas.className !== "hc");
      }
      btn.addEventListener("touchend", toggle, { passive: false });
      btn.addEventListener("click", toggle);
    })();

    // Scale the screen and the buttons to fit the display (integer scale keeps pixels crisp)
    function layout() {
      var w = window.innerWidth, h = window.innerHeight;
      var wrap = document.getElementById("controls-wrap");
      var ctl = document.getElementById("touch-controls");
      var cs = Math.min(w / 580, (h * 0.38) / 270, 3);
      ctl.style.transform = "scale(" + cs + ")";
      var wrapH = Math.round(270 * cs);
      wrap.style.height = wrapH + "px";
      var statusH = statusText.style.display === "none" ? 0 : statusText.offsetHeight;
      var pickerH = picker.style.display === "block" ? picker.offsetHeight : 0;
      var availH = h - wrapH - statusH - pickerH - 20;
      var s = Math.floor(Math.min((w - 24) / 160, (availH - 8) / 144));
      if (s < 1) s = 1;
      canvas.style.width = (160 * s + 8) + "px";   // +8 for the 4px border each side
      canvas.style.height = (144 * s + 8) + "px";
    }
    window.addEventListener("resize", layout);
    window.addEventListener("orientationchange", layout);
    layout();

    // Buttons. 0: Right, 1: Left, 2: Up, 3: Down, 4: A, 5: B, 6: Select, 7: Start
    function bindTouch(id, keyIndex) {
      var el = document.getElementById(id);
      if (!el) return;
      function press(e) { e.preventDefault(); el.classList.add("down"); if (gb) gb.JoyPadEvent(keyIndex, true); }
      function release(e) { e.preventDefault(); el.classList.remove("down"); if (gb) gb.JoyPadEvent(keyIndex, false); }
      el.addEventListener("touchstart", press, { passive: false });
      el.addEventListener("touchend", release, { passive: false });
      el.addEventListener("touchcancel", release, { passive: false });
      el.addEventListener("mousedown", press);
      el.addEventListener("mouseup", release);
      el.addEventListener("mouseleave", release);
    }
    bindTouch("btn-right", 0);
    bindTouch("btn-left", 1);
    bindTouch("btn-up", 2);
    bindTouch("btn-down", 3);
    bindTouch("btn-a", 4);
    bindTouch("btn-b", 5);
    bindTouch("btn-select", 6);
    bindTouch("btn-start", 7);

    // Keyboard (Mac/PC): arrows, Z=A, X=B, Shift=Select, Enter=Start
    var keyMap = { ArrowRight: 0, ArrowLeft: 1, ArrowUp: 2, ArrowDown: 3, z: 4, Z: 4, x: 5, X: 5, Shift: 6, Enter: 7 };
    window.addEventListener("keydown", function (e) {
      if (gb && keyMap.hasOwnProperty(e.key)) { e.preventDefault(); gb.JoyPadEvent(keyMap[e.key], true); }
    });
    window.addEventListener("keyup", function (e) {
      if (gb && keyMap.hasOwnProperty(e.key)) { e.preventDefault(); gb.JoyPadEvent(keyMap[e.key], false); }
    });
  </script>
</body>
</html>
