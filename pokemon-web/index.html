<!DOCTYPE html>

https://github.com/chrismaltby/gb-studio/blob/v2beta/appData/js-emulator/index.html
(see LICENSE.gbstudio)
-->
<head>
  <div id="kindle-debug" style="position:fixed; top:0; left:0; width:100%; color:#000; background:#fff; font-size:22px; font-weight:bold; z-index:999999; padding:15px; border-bottom:4px solid #000;">
    Testing Kindle capabilities...
  </div>
  <script>
    window.addEventListener('DOMContentLoaded', function() {
      const dbg = document.getElementById('kindle-debug');
      const hasWasm = typeof window.WebAssembly !== 'undefined';
      const hasBinjgb = typeof window.Binjgb !== 'undefined';
      
      dbg.innerText = "WASM Support: " + (hasWasm ? "YES" : "NO") + " | Binjgb script: " + (hasBinjgb ? "LOADED" : "FAILED/MISSING");
    });
    window.addEventListener('error', function(e) {
      document.getElementById('kindle-debug').innerText += " | ERR: " + e.message;
    });
  </script>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="simple.css">
  <title>binjgb (simple)</title>
</head>
<body>
  <div id="game">
    <canvas id="mainCanvas" width="160" height="144">No Canvas Support</canvas>
  </div>
  <div id="controller">
    <div id="controller_dpad">
      <div id="controller_left"></div>
      <div id="controller_right"></div>
      <div id="controller_up"></div>
      <div id="controller_down"></div>
    </div>
    <div id="controller_select" class="capsuleBtn">Select</div>
    <div id="controller_start" class="capsuleBtn">Start</div>
    <div id="controller_b" class="roundBtn">B</div>
    <div id="controller_a" class="roundBtn">A</div>
  </div>
  <script src="binjgb.js"></script>
  <script src="simple.js"></script>
</body>
