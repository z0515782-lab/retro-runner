<head>
  <div id="kindle-debug" style="position:fixed; top:0; left:0; width:100%; color:#000; background:#fff; font-size:24px; font-weight:bold; z-index:999999; padding:15px; border-bottom:4px solid #000;">Loading...</div>
  <script>
    window.addEventListener('error', function(e) {
      document.getElementById('kindle-debug').innerText = 'ERROR: ' + e.message + ' (line ' + e.lineno + ')';
    });
    window.addEventListener('unhandledrejection', function(e) {
      document.getElementById('kindle-debug').innerText = 'PROMISE ERROR: ' + (e.reason ? (e.reason.message || e.reason) : 'unknown');
    });
  </script>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="simple.css">
  <title>binjgb (simple)</title>
</head>
<body>
  <div id="game">
    <canvas id="mainCanvas" width="160" height="144">No Canvas Support</canvas>
  </div>
  <div id="controller">
    <div id="controller_dpad">
      <div id="controller_left"></div>
      <div id="controller_right"></div>
      <div id="controller_up"></div>
      <div id="controller_down"></div>
    </div>
    <div id="controller_select" class="capsuleBtn">Select</div>
    <div id="controller_start" class="capsuleBtn">Start</div>
    <div id="controller_b" class="roundBtn">B</div>
    <div id="controller_a" class="roundBtn">A</div>
  </div>
  <script src="binjgb.js"></script>
  <script src="simple.js"></script>
</body>
